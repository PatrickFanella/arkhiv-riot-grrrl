server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location ~ \.mjs$ { default_type application/javascript; }
  location ~ \.wasm$ { default_type application/wasm; }
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $public_api_upstream public-api:8080;
    proxy_pass http://$public_api_upstream;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
