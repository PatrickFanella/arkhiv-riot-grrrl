name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/arkhiv-pnpm" pnpm@10.33.0
          echo "$RUNNER_TEMP/arkhiv-pnpm/bin" >> "$GITHUB_PATH"
      - name: Install backup test dependency
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            apt_prefix=()
            if (( EUID != 0 )); then
              apt_prefix=(sudo)
            fi
            "${apt_prefix[@]}" apt-get update
            "${apt_prefix[@]}" apt-get install --yes --no-install-recommends rsync
          fi
      - name: Verify
        run: make verify
      - name: Isolated browser and PostgreSQL 17 smoke
        run: make test-browser

  image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish the deployable images for this revision
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
          REGISTRY: git.subcult.tv/subculture-collective
        run: |
          set -euo pipefail
          test -n "$REGISTRY_PAT"
          auth_dir=$(mktemp -d)
          trap 'rm -rf "$auth_dir"' EXIT
          chmod 700 "$auth_dir"
          export DOCKER_BUILDKIT=1 DOCKER_CONFIG="$auth_dir/docker"
          docker build -f web/Dockerfile --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$REGISTRY/arkhiv-riot-grrrl-web:$GITHUB_SHA" web
          docker build -f backend/Dockerfile --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$REGISTRY/arkhiv-riot-grrrl-api:$GITHUB_SHA" .
          IMAGES="$REGISTRY/arkhiv-riot-grrrl-web:$GITHUB_SHA $REGISTRY/arkhiv-riot-grrrl-api:$GITHUB_SHA"
          printf '%s' "$REGISTRY_PAT" | docker login git.subcult.tv --username subcult-agent --password-stdin
          for image in $IMAGES; do
            docker push "$image"
            echo "published $(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          done
