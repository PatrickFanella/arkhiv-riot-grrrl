# Merge these services into the homelab pilot composition after operator migration.
# Keep PUBLIC_DATABASE_URL in the existing private .env, never in Git.
services:
  public-api:
    image: riot-grrrl-api:${ARKHIV_PUBLIC_REVISION:?set exact verified image tag}
    user: '1000:1000'
    environment:
      ARKHIV_PUBLIC: '1'
      ARKHIV_REVISION: ${ARKHIV_PUBLIC_REVISION}
      DATABASE_URL: ${PUBLIC_DATABASE_URL:?set read-only role URL}
    volumes: [./pilot:/data/archive:ro]
    networks: [archive, public-reader]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    cpus: 1
    restart: unless-stopped
  public-web:
    image: riot-grrrl-web:${ARKHIV_PUBLIC_REVISION:?set exact verified image tag}
    volumes: [./public-nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: [127.0.0.1:54624:80]
    networks:
      public-reader: {}
      projects:
        aliases: [riot-grrrl-public-web]
    mem_limit: 128m
    pids_limit: 128
    cpus: 0.5
    restart: unless-stopped
networks:
  archive: {internal: true}
  public-reader: {internal: true}
  projects: {external: true}
