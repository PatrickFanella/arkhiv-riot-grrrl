services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: arkhiv
      POSTGRES_DB: arkhiv
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    secrets: [database-password]
    volumes: [core-metadata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U arkhiv -d arkhiv]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    cpus: 1
    restart: unless-stopped
  api:
    image: ${ARCHIVE_ENGINE_IMAGE:?Load deploy/archive-core.env}
    environment:
      DATABASE_URL_FILE: /run/secrets/database-url
      VHNESS_COLLECTION: ${COLLECTION:?Select this brand's reviewed collection}
      ARKHIV_COMPATIBILITY: print
      ARKHIV_PUBLIC: ${PUBLIC_MODE:-0}
      VHNESS_MEDIA: /archive
      VHNESS_DERIVATIVES: /derivatives
    secrets: [database-url]
    volumes: ["${ARCHIVE_ROOT:?Set the independently recovered archive root}:/archive:ro", "${DERIVATIVE_ROOT:?Set the independently recovered derivatives root}:/derivatives:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp:size=16m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped
  web:
    build: ../web
    depends_on: [api]
    ports: ["127.0.0.1:${WEB_PORT:-5173}:80"]
    restart: unless-stopped
  operator:
    profiles: [operator]
    image: ${ARCHIVE_ENGINE_IMAGE:?Load deploy/archive-core.env}
    command: [migrate]
    environment:
      DATABASE_URL_FILE: /run/secrets/operator-database-url
      VHNESS_COLLECTION: ${COLLECTION:?Select this brand's reviewed collection}
      VHNESS_MEDIA: /archive
      VHNESS_DERIVATIVES: /derivatives
    secrets: [operator-database-url]
    volumes: ["${ARCHIVE_ROOT:?Set the independently recovered archive root}:/archive:ro", "${DERIVATIVE_ROOT:?Set the independently recovered derivatives root}:/derivatives:ro", "${IMPORT_ROOT:?Set the verified migration inputs}:/imports:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
secrets:
  database-password:
    file: ${SECRET_ROOT:?Set the private secret directory}/database-password
  database-url:
    file: ${SECRET_ROOT:?Set the private secret directory}/database-url
  operator-database-url:
    file: ${SECRET_ROOT:?Set the private secret directory}/operator-database-url
volumes:
  core-metadata:
